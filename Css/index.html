<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Header{
            color: deeppink;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 30px;
        }
        .container{
            width: 20vw;
            height: 50vh;
            border: 2px solid gray;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            background-image: url(https://i.pinimg.com/736x/70/62/ca/7062ca72efff0f4e166ad1a68d9f1b36.jpg);
            background-size: cover;
        }
        .container img{
            width: 100%;
            height: 300px;
            border: 2px solid gray;
            border-radius: 10px;
        }
        .container h4{
            color: blueviolet;
        }
        .container button{
            background-color: blue;
            color: white;
            border-radius: 5px;
            font-size: 15px;
            font-family: 'Times New Roman', Times, serif;

        }
    </style>
</head>
<body>
    <h1 class="Header"><b><u>School Card Design</u></b></h1>

    <div class="container">
        <img src="https://i.pinimg.com/736x/c8/d6/01/c8d6014fbae40ed212141c34d594c271.jpg" alt="">
        <h4>Name : Panda</h4>

        <button>Contect Me</button>

</html>
